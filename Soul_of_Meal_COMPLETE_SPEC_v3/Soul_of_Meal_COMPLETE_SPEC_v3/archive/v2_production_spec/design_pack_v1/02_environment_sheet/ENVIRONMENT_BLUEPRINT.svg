d units  •  chunk: 1024×1024  •  1 tile: 64×64</text><rect fill="#FFFFFF" height="378" rx="18" ry="18" stroke="#CBAE81" stroke-width="2" width="527" x="1045" y="111" /><rect fill="#5B3044" height="41" rx="16" width="527" x="1045" y="111" /><text fill="white" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" x="1064" y="139">OBJECT FOOTPRINT / TRIGGER</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="180">Nhà nhỏ              4×4 đến 6×5 tile</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="216">Guild hall           8×6 đến 10×8 tile</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="252">Cửa                  trigger 64×32 units</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="288">NPC                  cao 64–96 units</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="324">Interaction radius   1.25 tile (~80 u)</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="360">Các lớp: ground → props → entity</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="396">                → foreground → lights</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" x="1063" y="432">Y-sort dựa chân actor, không top texture</text><rect fill="#FFFFFF" height="413" rx="18" ry="18" stroke="#CBAE81" stroke-width="2" width="527" x="1045" y="507" /><rect fill="#5B3044" height="41" rx="16" width="527" x="1045" y="507" /><text fill="white" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" x="1064" y="535">TƯƠNG TÁC &amp; TRẠNG THÁI</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="579">NPC: patrol → in_range → talk → idle</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="618">Rương: closed → open → claimed</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="657">Cửa: closed → opening → interior</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="696">Locked: show reason + hint unlock</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="735">Nguyên liệu: ripe → harvest → depleted</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="774">Quest ! / ? là overlay, không bake vào art</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="813">Mái nhà che actor phải fade opacity</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" x="1062" y="852">Mỗi công trình nổi bật cần gameplay value</text></svg>