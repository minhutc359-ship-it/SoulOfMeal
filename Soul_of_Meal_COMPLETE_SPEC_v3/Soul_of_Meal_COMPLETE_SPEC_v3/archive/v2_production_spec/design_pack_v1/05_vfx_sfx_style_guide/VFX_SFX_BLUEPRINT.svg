ont-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="571">Asset hierarchy: character &gt; element &gt; neutral.</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="613">Small hit: 512×512 px · 120–250ms</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="655">Mid hit: 1024×1024 px · 200–400ms</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="697">Ultimate FX: 2048×2048 master · 400–900ms</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="739">Low ~120 / Medium ~250 / High ~650 particles</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="781">VFX sockets: blade_tip · muzzle · target.center</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="53" y="823">Không che telegraph / HP / UI tối quan trọng</text><rect fill="#FFFFFF" height="490" rx="18" ry="18" stroke="#CBAE81" stroke-width="2" width="777" x="795" y="418" /><rect fill="#5B3044" height="41" rx="16" width="777" x="795" y="418" /><text fill="white" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" x="814" y="446">SFX / AUDIO BUS / IMPLEMENTATION</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="487">Master (true peak target ≤ -1 dBTP)</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="529">   ├ Music: BGM / adaptive stems</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="571">   ├ Ambience: village, forest, water</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="613">   ├ SFX_Gameplay: hit, skills, traps, chess</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="655">   ├ SFX_UI: button, panel, toast</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="697">   └ Voice: character lines &amp; warnings</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="739">Source WAV 48kHz / 24-bit; runtime OGG/fallback</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="781">Ultimate voice: duck BGM ~ -4dB</text><text fill="#332637" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" x="823" y="823">sfx_fire_blast_large  |  vo_chr_bunbo_ultimate_vi</text></svg>